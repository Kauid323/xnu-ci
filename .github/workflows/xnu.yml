name: xnu

# Two jobs:
#   rebase  - no toolchain needed: fetch the target XNU, apply the hackios patch with fuzz and
#             report what still has to be ported by hand (the .rej files come back as artifacts).
#   build   - the real thing: theos + Linux cctools + iPhoneOS SDK, then mach_kernel.
#
# The build job only makes sense once the patch applies cleanly; run it by hand
# (Actions -> xnu -> Run workflow -> build=true) when that is the case.

on:
  push:
    paths: ['patches/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      build:
        description: 'also run the full kernel build'
        type: boolean
        default: false
      xnu_tag:
        description: 'XNU tag (iOS 15.3 = xnu-8020.140.41)'
        default: 'xnu-8020.140.41'
      sdk:
        description: 'theos SDK directory name'
        default: 'iPhoneOS16.5.sdk'

env:
  XNU_TAG: ${{ inputs.xnu_tag || 'xnu-8020.140.41' }}
  XNU_SDK: ${{ inputs.sdk || 'iPhoneOS16.5.sdk' }}
  PATCH: patches/hackios-8020.patch

jobs:
  rebase:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: fetch ${{ env.XNU_TAG }}
        run: |
          set -eux
          curl -sSL -o xnu.tar.gz "https://codeload.github.com/apple-oss-distributions/xnu/tar.gz/refs/tags/${XNU_TAG}"
          tar xzf xnu.tar.gz
          mv "xnu-${XNU_TAG}" src || mv xnu-* src
          cd src && git init -q . && git add -A && git -c user.email=ci@local -c user.name=ci commit -qm vanilla

      - name: apply with fuzz, collect what is left
        run: |
          cd src
          set +e
          patch -p1 -F3 --no-backup-if-mismatch < "../${PATCH}" > ../apply.log 2>&1
          echo "exit=$?" >> ../apply.log
          grep -c 'FAILED' ../apply.log || true
          find . -name '*.rej' | sort > ../rejects.txt
          wc -l < ../rejects.txt
          exit 0

      - name: summary
        run: |
          {
            echo "### rebase report for ${XNU_TAG}"
            echo
            echo '```'
            grep -E 'FAILED|succeeded at' apply.log | head -60
            echo '```'
            echo
            echo "**files with rejects**"
            echo '```'
            cat rejects.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: rebase-report
          path: |
            apply.log
            rejects.txt
            src/**/*.rej

  build:
    if: ${{ inputs.build == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl tar xz-utils make clang lld flex bison m4 perl python3 \
            autoconf automake libssl-dev libelf-dev zlib1g-dev pkg-config

      - name: cache theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ env.XNU_SDK }}-1

      - name: theos (Linux cctools + SDK)
        id: theos
        run: ./scripts/setup-theos.sh "$XNU_SDK"

      - name: hackios (xnu-deps + build script)
        run: git clone --depth 1 https://github.com/oosexgang/hackios-xnu-kernel.git hackios

      - name: cache xnu-deps sources
        uses: actions/cache@v4
        with:
          # only what setup.sh fetches and then skips when it is there (a few hundred MB);
          # host/, sdk/ and build/ are left out so stage 1 and 2 really run every time
          path: |
            hackios/xnu-deps/AvailabilityVersions
            hackios/xnu-deps/libdispatch
            hackios/xnu-deps/libpthread
            hackios/xnu-deps/mm_bootstrap_cmds
            hackios/xnu-deps/tcsh
            hackios/xnu-deps/unifdef
            hackios/xnu-deps/MacOSX13.3.sdk
          key: xnudeps-src-1

      - name: xnu source
        run: ./scripts/fetch-xnu.sh "$XNU_TAG" "$PATCH"

      - name: xnu-deps
        run: |
          set +e
          ./scripts/deps.sh 2>&1 | tee deps.log
          echo "deps=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: build
        if: env.deps == '0'
        run: |
          set +e
          ./scripts/build.sh 2>&1 | tee build.log
          echo "build=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: errors
        if: always()
        run: |
          {
            echo "### deps=${deps:-skipped} build=${build:-skipped}"
            echo
            echo '```'
            grep -nE 'error:|Error [0-9]|No rule to make|fatal error|undefined symbol|ld: ' build.log 2>/dev/null | head -120
            echo '```'
            echo
            echo "**first failing object**"
            echo '```'
            grep -nE '\*\*\* \[.*\.o\]' build.log 2>/dev/null | head -5
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            deps.log
            hackios/xnu-deps/exporthdrs.log
            hackios/xnu-deps/build/**/*.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mach-kernel
          path: out/
          if-no-files-found: warn

      - name: verdict
        if: always()
        run: |
          echo "deps=${deps:-skipped} build=${build:-skipped}"
          [ "${deps:-1}" = "0" ] && [ "${build:-1}" = "0" ]
